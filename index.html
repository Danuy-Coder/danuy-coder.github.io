<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CynixOS - Mobile App</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- RemixIcon CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Aurora Background Animation */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation-duration: 20s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #00f5ff, #0080ff);
            top: -100px;
            left: -100px;
            animation-name: float1;
        }

        .orb2 {
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            top: 50%;
            right: -100px;
            animation-name: float2;
        }

        .orb3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            bottom: -100px;
            left: 30%;
            animation-name: float3;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(100px, 150px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-120px, -100px) scale(1.2); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, -120px) scale(0.9); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 15px;
        }

        /* Header */
        .header {
            padding: 20px 15px 10px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* EVA Wallet Styles */
        .balance-card {
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .target-info {
            font-size: 13px;
            color: #64748b;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f5ff, #a855f7);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.8);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .history-list {
            margin-top: 20px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info {
            flex: 1;
        }

        .history-desc {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
        }

        .history-date {
            font-size: 12px;
            color: #64748b;
            margin-top: 3px;
        }

        .history-amount {
            font-size: 18px;
            font-weight: 700;
            color: #059669;
            margin-right: 10px;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Chat Styles */
        .chat-container {
            height: calc(100vh - 250px);
            overflow-y: auto;
            padding: 10px 0;
            -webkit-overflow-scrolling: touch;
        }

        .chat-container::-webkit-scrollbar {
            width: 0;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            margin-bottom: 12px;
            word-wrap: break-word;
            animation: popIn 0.2s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .chat-bubble.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.ai {
            background: rgba(255, 255, 255, 0.8);
            color: #1e293b;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            font-size: 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #a855f7;
        }

        .btn-send {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading:nth-child(1) { animation-delay: -0.32s; }
        .loading:nth-child(2) { animation-delay: -0.16s; margin: 0 5px; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Notes Styles */
        .note-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-text {
            flex: 1;
            font-size: 15px;
            color: #1e293b;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-export {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-import {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        #importFile {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            padding: 12px 0;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 24px;
            color: #64748b;
            transition: all 0.3s;
        }

        .nav-item span {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-item.active {
            background: rgba(167, 139, 250, 0.2);
        }

        .nav-item.active i,
        .nav-item.active span {
            color: #7c3aed;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Aurora Background -->
    <div class="aurora-bg">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- Header -->
    <div class="header">
        <h1>CynixOS</h1>
    </div>

    <!-- Tab 1: EVA Wallet -->
    <div id="tab-wallet" class="tab-content active">
        <div class="glass-card balance-card">
            <div class="balance-label">Total Savings</div>
            <div class="balance-amount" id="totalBalance">Rp 0</div>
            <div class="target-info">Target: Rp 12.000.000</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="glass-card">
            <div class="input-group">
                <label>Amount (Rp)</label>
                <input type="number" id="savingAmount" placeholder="Enter amount">
            </div>
            <div class="input-group">
                <label>Description</label>
                <input type="text" id="savingDesc" placeholder="e.g., Monthly savings">
            </div>
            <button class="btn btn-primary" onclick="addSaving()">
                <i class="ri-add-line"></i> Add Savings
            </button>
        </div>

        <div class="glass-card">
            <h3 style="margin-bottom: 15px; color: #1e293b;">Recent Transactions</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- Tab 2: Cynix AI -->
    <div id="tab-ai" class="tab-content">
        <div class="glass-card" style="height: calc(100vh - 180px);">
            <div class="chat-container" id="chatContainer"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ask Cynix AI anything...">
                <button class="btn-send" onclick="sendMessage()">
                    <i class="ri-send-plane-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Tab 3: Workspace -->
    <div id="tab-workspace" class="tab-content">
        <div class="glass-card">
            <h3 style="margin-bottom: 15px; color: #1e293b;">Quick Notes</h3>
            <div class="input-group">
                <input type="text" id="noteInput" placeholder="Write a note...">
            </div>
            <button class="btn btn-primary" onclick="addNote()">
                <i class="ri-sticky-note-add-line"></i> Add Note
            </button>
            <div id="notesList" style="margin-top: 20px;"></div>
        </div>

        <div class="glass-card">
            <h3 style="margin-bottom: 15px; color: #1e293b;">Data Management</h3>
            <div class="btn-group">
                <button class="btn btn-export" onclick="exportData()">
                    <i class="ri-download-line"></i> Export Data
                </button>
                <button class="btn btn-import">
                    <i class="ri-upload-line"></i> Import Data
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)">
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('wallet')">
            <i class="ri-wallet-3-line"></i>
            <span>Wallet</span>
        </div>
        <div class="nav-item" onclick="switchTab('ai')">
            <i class="ri-robot-line"></i>
            <span>Cynix AI</span>
        </div>
        <div class="nav-item" onclick="switchTab('workspace')">
            <i class="ri-file-list-3-line"></i>
            <span>Workspace</span>
        </div>
    </div>

    <script>
        // ===== DATA INITIALIZATION =====
        let savings = JSON.parse(localStorage.getItem('cynix_savings')) || [];
        let notes = JSON.parse(localStorage.getItem('cynix_notes')) || [];
        let chatHistory = [];

        const TARGET_AMOUNT = 12000000;

        // ===== NAVIGATION SYSTEM =====
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Remove active from all nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');

            // Refresh content
            if (tabName === 'wallet') {
                renderWallet();
            } else if (tabName === 'workspace') {
                renderNotes();
            }
        }

        // ===== WALLET FUNCTIONS =====
        function addSaving() {
            const amount = parseFloat(document.getElementById('savingAmount').value);
            const desc = document.getElementById('savingDesc').value.trim();

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount!');
                return;
            }

            if (!desc) {
                alert('Please enter a description!');
                return;
            }

            const saving = {
                id: Date.now(),
                amount: amount,
                description: desc,
                date: new Date().toLocaleString('id-ID')
            };

            savings.unshift(saving);
            localStorage.setItem('cynix_savings', JSON.stringify(savings));

            // Clear inputs
            document.getElementById('savingAmount').value = '';
            document.getElementById('savingDesc').value = '';

            renderWallet();
        }

        function deleteSaving(id) {
            if (confirm('Delete this transaction?')) {
                savings = savings.filter(s => s.id !== id);
                localStorage.setItem('cynix_savings', JSON.stringify(savings));
                renderWallet();
            }
        }

        function renderWallet() {
            // Calculate total
            const total = savings.reduce((sum, s) => sum + s.amount, 0);
            const progress = Math.min((total / TARGET_AMOUNT) * 100, 100);

            // Update UI
            document.getElementById('totalBalance').textContent = 
                `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('progressFill').style.width = `${progress}%`;

            // Render history
            const historyList = document.getElementById('historyList');
            if (savings.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <i class="ri-inbox-line"></i>
                        <p>No transactions yet</p>
                    </div>
                `;
            } else {
                historyList.innerHTML = savings.map(s => `
                    <div class="history-item">
                        <div class="history-info">
                            <div class="history-desc">${s.description}</div>
                            <div class="history-date">${s.date}</div>
                        </div>
                        <div class="history-amount">+${s.amount.toLocaleString('id-ID')}</div>
                        <button class="btn-delete" onclick="deleteSaving(${s.id})">
                            <i class="ri-delete-bin-line"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        // ===== AI CHAT FUNCTIONS =====
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addChatBubble(message, 'user');
            input.value = '';

            // Show loading
            const loadingId = Date.now();
            addChatBubble(`
                <span class="loading"></span>
                <span class="loading"></span>
                <span class="loading"></span>
            `, 'ai', loadingId);

            try {
                // Fetch from Pollinations AI
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(message)}`);
                const aiResponse = await response.text();

                // Remove loading and add AI response
                removeLoadingBubble(loadingId);
                addChatBubble(aiResponse, 'ai');
            } catch (error) {
                removeLoadingBubble(loadingId);
                addChatBubble('Sorry, I encountered an error. Please try again! 🤖', 'ai');
                console.error('AI Error:', error);
            }
        }

        function addChatBubble(message, sender, id = null) {
            const chatContainer = document.getElementById('chatContainer');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;
            bubble.innerHTML = message;
            if (id) bubble.dataset.id = id;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingBubble(id) {
            const bubble = document.querySelector(`[data-id="${id}"]`);
            if (bubble) bubble.remove();
        }

        // Enter to send
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });

        // ===== NOTES FUNCTIONS =====
        function addNote() {
            const noteText = document.getElementById('noteInput').value.trim();

            if (!noteText) {
                alert('Please enter a note!');
                return;
            }

            const note = {
                id: Date.now(),
                text: noteText,
                date: new Date().toLocaleString('id-ID')
            };

            notes.unshift(note);
            localStorage.setItem('cynix_notes', JSON.stringify(notes));

            document.getElementById('noteInput').value = '';
            renderNotes();
        }

        function deleteNote(id) {
            if (confirm('Delete this note?')) {
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('cynix_notes', JSON.stringify(notes));
                renderNotes();
            }
        }

        function renderNotes() {
            const notesList = document.getElementById('notesList');
            if (notes.length === 0) {
                notesList.innerHTML = `
                    <div class="empty-state">
                        <i class="ri-sticky-note-line"></i>
                        <p>No notes yet</p>
                    </div>
                `;
            } else {
                notesList.innerHTML = notes.map(n => `
                    <div class="note-item">
                        <div class="note-text">${n.text}</div>
                        <button class="btn-delete" onclick="deleteNote(${n.id})">
                            <i class="ri-delete-bin-line"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        // ===== DATA MANAGEMENT =====
        function exportData() {
            const data = {
                savings: savings,
                notes: notes,
                exportDate: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cynixos_backup_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            alert('Data exported successfully! ✅');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);

                    if (data.savings && data.notes) {
                        savings = data.savings;
                        notes = data.notes;

                        localStorage.setItem('cynix_savings', JSON.stringify(savings));
                        localStorage.setItem('cynix_notes', JSON.stringify(notes));

                        renderWallet();
                        renderNotes();

                        alert('Data imported successfully! ✅');
                    } else {
                        alert('Invalid backup file! ❌');
                    }
                } catch (error) {
                    alert('Error reading file! ❌');
                    console.error('Import Error:', error);
                }
            };
            reader.readAsText(file);

            // Reset file input
            event.target.value = '';
        }

        // ===== INITIALIZE APP =====
        renderWallet();
        addChatBubble('Hello! I\'m Cynix AI. How can I help you today? 🤖', 'ai');
    </script>
</body>
</html>
