<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"> 
    
    <title>CynixOS Pro | Ultimate</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        cyan: { DEFAULT: '#06b6d4', dim: 'rgba(6, 182, 212, 0.1)' },
                        dark: { bg: '#000000', surface: '#121212', border: '#27272a' },
                        light: { bg: '#ffffff', surface: '#f8fafc', border: '#e2e8f0' }
                    },
                    animation: {
                        'jelly': 'jellyJump 0.6s infinite',
                        'cursor': 'cursorBlink 1s infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        jellyJump: {
                            '0%, 100%': { transform: 'scale(1.25, 0.75) translateY(0)' },
                            '50%': { transform: 'scale(0.75, 1.25) translateY(-15px)' },
                        },
                        cursorBlink: { '0%, 100%': { opacity: 1 }, '50%': { opacity: 0 } },
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .light .glass { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0, 0, 0, 0.05); }
        .typing-cursor::after { content: '▋'; display: inline-block; margin-left: 2px; animation: cursorBlink 0.8s infinite; color: #06b6d4; font-size: 0.8em; }
        .no-select { user-select: none; -webkit-user-select: none; }
        .delay-100 { animation-delay: 0.1s; } .delay-200 { animation-delay: 0.2s; }
    </style>
</head>

<body class="antialiased h-[100dvh] overflow-hidden selection:bg-cyan selection:text-white flex flex-col"
      :class="isDark ? 'bg-dark-bg text-white' : 'bg-light-bg text-slate-900'"
      x-data="cynixApp()" x-init="initSystem()">

    <div x-show="isLoading || isTabLoading" 
         class="fixed inset-0 z-[9999] bg-black/40 backdrop-blur-xl flex flex-col items-center justify-center transition-opacity duration-500"
         x-transition:leave="opacity-0">
        <div class="flex gap-3 mb-4">
            <div class="w-4 h-4 bg-cyan rounded-full animate-jelly shadow-[0_0_20px_#06b6d4]"></div>
            <div class="w-4 h-4 bg-purple-500 rounded-full animate-jelly delay-100 shadow-[0_0_20px_#a855f7]"></div>
            <div class="w-4 h-4 bg-pink-500 rounded-full animate-jelly delay-200 shadow-[0_0_20px_#ec4899]"></div>
        </div>
        <div x-show="isLoading" class="text-xs font-bold tracking-[0.3em] text-white/80 animate-pulse">LOADING ASSETS...</div>
    </div>

    <div class="flex h-full w-full relative z-0">
        
        <aside class="w-16 md:w-64 flex-shrink-0 border-r flex flex-col justify-between py-6 z-30 transition-colors"
               :class="isDark ? 'bg-dark-surface border-dark-border' : 'bg-light-surface border-light-border'">
            <div class="flex justify-center md:justify-start md:px-6 mb-6 items-center gap-3 no-select">
                <div class="w-10 h-10 rounded-xl bg-cyan text-white flex items-center justify-center shadow-lg shadow-cyan/30 flex-shrink-0">
                    <i class="ri-command-fill text-xl"></i>
                </div>
                <div class="hidden md:block leading-none">
                    <div class="font-bold text-lg">Cynix</div>
                    <div class="text-[10px] opacity-60 tracking-wider">WORKSPACE</div>
                </div>
            </div>
            <nav class="flex-1 px-2 md:px-4 space-y-2">
                <template x-for="item in menu" :key="item.id">
                    <button @click="switchTab(item.id)" class="w-full flex items-center p-3 rounded-xl transition-all relative group overflow-hidden no-select" :class="activeTab === item.id ? (isDark ? 'bg-white text-black' : 'bg-black text-white') : 'hover:bg-cyan/10 hover:text-cyan'"><i :class="item.icon" class="text-xl flex-shrink-0"></i><span class="hidden md:block ml-3 text-sm font-semibold" x-text="item.label"></span></button>
                </template>
            </nav>
            <div class="px-2 md:px-4">
                <button @click="toggleTheme()" class="w-full p-3 rounded-xl border flex justify-center md:justify-start gap-3 transition-colors" :class="isDark ? 'border-dark-border hover:bg-white/5' : 'border-light-border hover:bg-slate-100'"><i :class="isDark ? 'ri-moon-clear-line text-cyan' : 'ri-sun-line text-orange-500'"></i></button>
            </div>
        </aside>

        <main class="flex-1 relative flex flex-col overflow-hidden h-full">

            <div x-show="activeTab === 'finance'" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 animate-fade-in">
                <header class="flex justify-between items-center">
                    <div><h2 class="text-2xl font-bold">Finance</h2><p class="text-sm opacity-60">Overview Dompet</p></div>
                    <button @click="showAddModal = true" class="px-4 py-2 rounded-lg bg-cyan text-white font-bold shadow-lg shadow-cyan/20 active:scale-95 transition-transform flex items-center gap-2"><i class="ri-add-line"></i> <span class="hidden md:inline">Transaksi</span></button>
                </header>
                <div class="relative w-full md:w-96 h-56 rounded-3xl overflow-hidden shadow-2xl group no-select">
                    <div class="absolute inset-0 bg-gradient-to-br from-cyan to-blue-700 transition-transform duration-700 group-hover:scale-105"></div>
                    <div class="relative z-10 p-6 h-full flex flex-col justify-between text-white glass border border-white/20">
                        <div class="flex justify-between"><i class="ri-rfid-line text-3xl opacity-60"></i><i class="ri-visa-line text-4xl"></i></div>
                        <div><div class="text-sm opacity-80 mb-1">Total Balance</div><div class="text-3xl font-mono font-bold" x-text="formatRupiah(balance)"></div></div>
                        <div class="flex justify-between items-end"><div class="text-sm font-mono opacity-80">**** 4582</div><div class="bg-black/20 px-2 py-1 rounded text-xs font-bold">PLATINUM</div></div>
                    </div>
                </div>
                <div class="rounded-2xl border overflow-hidden flex-1" :class="isDark ? 'bg-dark-surface border-dark-border' : 'bg-white border-light-border'">
                    <div class="p-4 border-b font-bold flex gap-2" :class="isDark ? 'border-dark-border' : 'border-light-border'"><i class="ri-history-line text-cyan"></i> Riwayat <button @click="resetFinance()" class="ml-auto text-xs text-red-500 hover:underline">Reset</button></div>
                    <div class="overflow-y-auto max-h-[400px]">
                        <template x-for="trx in transactions" :key="trx.id">
                            <div class="p-4 flex items-center justify-between border-b last:border-0 hover:bg-cyan/5 transition-colors" :class="isDark ? 'border-dark-border' : 'border-light-border'">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center" :class="trx.type === 'in' ? 'bg-green-500/10 text-green-500' : 'bg-red-500/10 text-red-500'"><i :class="trx.type === 'in' ? 'ri-arrow-left-down-line' : 'ri-arrow-right-up-line'"></i></div>
                                    <div><div class="font-bold text-sm" x-text="trx.name"></div><div class="text-xs opacity-60" x-text="trx.date"></div></div>
                                </div>
                                <div class="font-mono font-bold text-sm" :class="trx.type === 'in' ? 'text-green-500' : 'text-red-500'" x-text="(trx.type === 'in' ? '+' : '-') + formatRupiah(trx.amount)"></div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div x-show="activeTab === 'chat'" class="flex-1 flex flex-col h-full relative overflow-hidden animate-fade-in">
                <div class="h-16 border-b flex items-center justify-between px-4 z-20 flex-shrink-0" :class="isDark ? 'bg-dark-surface/80 backdrop-blur-md border-dark-border' : 'bg-white/80 backdrop-blur-md border-light-border'">
                    <div class="flex items-center gap-3">
                        <div class="relative group cursor-pointer">
                            <img :src="aiAvatar" class="w-10 h-10 rounded-full object-cover border border-white/10 shadow-lg transition-transform group-hover:scale-110">
                            <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-black rounded-full animate-pulse"></div>
                        </div>
                        <div>
                            <div class="font-bold text-sm">Cynix AI</div>
                            <div class="text-[10px] text-cyan flex items-center gap-1" x-text="isThinking ? 'Sedang berpikir...' : 'Online'"></div>
                        </div>
                    </div>
                    <button @click="clearChat()" class="p-2 text-red-500 opacity-50 hover:opacity-100"><i class="ri-delete-bin-line"></i></button>
                </div>

                <div id="chatArea" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth w-full" :class="isDark ? 'bg-dark-bg' : 'bg-slate-50'">
                    <div class="h-4"></div>
                    <template x-for="msg in messages" :key="msg.id">
                        <div class="w-full flex flex-col relative"
                             :class="msg.sender === 'user' ? 'items-end' : 'items-start'"
                             x-data="swipeHandler(msg)"
                             @touchstart="startSwipe($event)" @touchmove="moveSwipe($event)" @touchend="endSwipe()"
                             @contextmenu.prevent="triggerLongPress()">

                            <div x-show="msg.replyTo" class="text-[10px] opacity-60 mb-1 flex items-center gap-1 px-1">
                                <i class="ri-reply-fill"></i> <span x-text="'Replying to: ' + (msg.replyTo ? msg.replyTo.text.substring(0,15)+'...' : '')"></span>
                            </div>

                            <div class="relative max-w-[85%] md:max-w-[70%] transition-transform duration-100 ease-out swipe-target" :style="`transform: translateX(${offsetX}px)`">
                                <div class="absolute top-1/2 -translate-y-1/2 -left-10 text-cyan opacity-0 transition-opacity" :class="offsetX > 30 ? 'opacity-100' : 'opacity-0'"><i class="ri-reply-fill text-xl bg-dark-surface rounded-full p-1"></i></div>
                                <div class="px-4 py-3 shadow-sm text-sm leading-relaxed relative cursor-pointer select-none"
                                     @touchstart="startLongPress($event)" @touchend="endSwipe(); cancelLongPress()"
                                     @mousedown="startLongPress($event)" @mouseup="cancelLongPress()"
                                     :class="[
                                        msg.sender === 'user' ? 'bg-gradient-to-r from-cyan to-blue-600 text-white rounded-2xl rounded-tr-sm' : (isDark ? 'bg-dark-surface border border-dark-border' : 'bg-white border border-light-border') + ' rounded-2xl rounded-tl-sm glass',
                                        (msg.isTypingEffect ? 'typing-cursor' : '')
                                     ]">
                                    <div x-html="parseMarkdown(msg.text)"></div>
                                    <div class="text-[10px] mt-1 text-right opacity-70" x-text="msg.time"></div>
                                    <div x-show="msg.reaction" class="absolute -bottom-2 right-0 bg-gray-800 text-white text-xs px-1.5 py-0.5 rounded-full border border-gray-600 animate-pop z-10" x-text="msg.reaction"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                    
                    <div x-show="isThinking" class="flex justify-start animate-fade-in w-full">
                        <div class="px-4 py-3 rounded-2xl glass border flex items-center gap-3" :class="isDark ? 'bg-dark-surface border-dark-border' : 'bg-white border-light-border'">
                            <div class="flex gap-1">
                                <span class="w-1.5 h-1.5 bg-cyan rounded-full animate-jelly"></span>
                                <span class="w-1.5 h-1.5 bg-cyan rounded-full animate-jelly delay-100"></span>
                                <span class="w-1.5 h-1.5 bg-cyan rounded-full animate-jelly delay-200"></span>
                            </div>
                            <span class="text-xs text-cyan font-bold animate-pulse">Sedang berpikir...</span>
                        </div>
                    </div>
                    <div class="h-4"></div>
                </div>

                <div class="p-3 border-t z-30 flex-shrink-0 w-full" :class="isDark ? 'bg-dark-surface border-dark-border' : 'bg-white border-light-border'">
                    <div x-show="replyingTo" class="mb-2 p-2 rounded bg-cyan/10 border-l-4 border-cyan flex justify-between items-center text-xs animate-pop">
                        <div><span class="text-cyan font-bold block">Replying...</span><span class="opacity-70 truncate block max-w-[200px]" x-text="replyingTo ? replyingTo.text : ''"></span></div>
                        <button @click="replyingTo = null"><i class="ri-close-line"></i></button>
                    </div>
                    <div class="flex items-end gap-2">
                        <div class="flex-1 rounded-2xl border px-4 py-2 flex items-center transition-colors focus-within:border-cyan" :class="isDark ? 'bg-dark-bg border-dark-border' : 'bg-slate-50 border-light-border'">
                            <textarea x-model="chatInput" @keydown.enter.prevent="sendMessage()" placeholder="Ketik pesan..." rows="1" class="w-full bg-transparent border-none outline-none resize-none max-h-32 text-sm" @focus="scrollToBottom()"></textarea>
                        </div>
                        <button @click="sendMessage()" class="p-3 rounded-xl bg-cyan text-white shadow-lg active:scale-95 transition-transform"><i class="ri-send-plane-fill"></i></button>
                    </div>
                </div>

                <div x-show="activeContextMenu" class="fixed inset-0 z-[60] flex items-end justify-center bg-black/60 backdrop-blur-sm pb-10" x-transition.opacity @click="activeContextMenu = null">
                    <div class="w-[90%] max-w-sm bg-gray-900 border border-gray-700 rounded-3xl p-4 shadow-2xl animate-pop flex flex-col items-center gap-4" @click.stop>
                        <div class="text-xs text-gray-400 font-bold uppercase tracking-widest">Reactions</div>
                        <div class="flex justify-between w-full px-4">
                            <button @click="reactToContext('❤️')" class="text-3xl hover:scale-125 transition-transform">❤️</button>
                            <button @click="reactToContext('😂')" class="text-3xl hover:scale-125 transition-transform">😂</button>
                            <button @click="reactToContext('🔥')" class="text-3xl hover:scale-125 transition-transform">🔥</button>
                            <button @click="reactToContext('👍')" class="text-3xl hover:scale-125 transition-transform">👍</button>
                        </div>
                        <div class="w-full h-[1px] bg-gray-700"></div>
                        <div class="flex flex-col w-full gap-2">
                            <button @click="replyFromContext()" class="w-full py-3 rounded-xl bg-gray-800 hover:bg-gray-700 flex items-center justify-center gap-2 font-bold text-sm"><i class="ri-reply-fill"></i> Reply</button>
                            <button @click="copyFromContext()" class="w-full py-3 rounded-xl bg-gray-800 hover:bg-gray-700 flex items-center justify-center gap-2 font-bold text-sm"><i class="ri-file-copy-line"></i> Copy</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div x-show="showAddModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" x-transition.opacity style="display: none;">
        <div class="w-full max-w-sm rounded-2xl p-6 border shadow-2xl animate-pop" :class="isDark ? 'bg-dark-surface border-dark-border' : 'bg-white border-light-border'" @click.away="showAddModal = false">
            <h3 class="text-lg font-bold mb-4">Tambah Transaksi</h3>
            <div class="space-y-3">
                <input type="text" x-model="newTrx.name" placeholder="Nama" class="w-full p-3 rounded-xl bg-transparent border outline-none focus:border-cyan" :class="isDark ? 'border-dark-border' : 'border-light-border'">
                <div class="flex gap-3">
                    <input type="number" x-model="newTrx.amount" placeholder="Rp" class="flex-1 p-3 rounded-xl bg-transparent border outline-none focus:border-cyan" :class="isDark ? 'border-dark-border' : 'border-light-border'">
                    <select x-model="newTrx.type" class="p-3 rounded-xl bg-transparent border outline-none focus:border-cyan" :class="isDark ? 'border-dark-border' : 'border-light-border'"><option value="out" class="text-black">Keluar (-)</option><option value="in" class="text-black">Masuk (+)</option></select>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button @click="showAddModal = false" class="flex-1 p-3 rounded-xl border opacity-70" :class="isDark ? 'border-dark-border' : 'border-light-border'">Batal</button>
                <button @click="addTransaction()" class="flex-1 p-3 rounded-xl bg-cyan text-white font-bold">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        function cynixApp() {
            return {
                isDark: true, activeTab: 'finance', isLoading: true, isTabLoading: false, loadPercent: 0, showAddModal: false,
                balance: 0, transactions: [], newTrx: { name: '', amount: '', type: 'out' },
                chatInput: '', replyingTo: null, messages: [],
                aiAvatar: 'https://files.catbox.moe/0et3x4.png',
                menu: [{ id: 'finance', label: 'Keuangan', icon: 'ri-wallet-3-fill' }, { id: 'chat', label: 'Cynix AI', icon: 'ri-chat-voice-fill' }],
                activeContextMenu: null, selectedMsgForContext: null,
                isThinking: false, // STATUS BERFIKIR

                initSystem() {
                    if (localStorage.getItem('theme') === 'light') this.isDark = false;
                    const savedFinance = localStorage.getItem('cynix_finance');
                    if (savedFinance) { const d = JSON.parse(savedFinance); this.balance = d.balance; this.transactions = d.transactions; }
                    
                    // Request Notification Permission on Start
                    if ("Notification" in window) { Notification.requestPermission(); }

                    const img = new Image(); img.src = this.aiAvatar;
                    let interval = setInterval(() => {
                        this.loadPercent += Math.floor(Math.random() * 20) + 10;
                        if (this.loadPercent >= 100) {
                            this.loadPercent = 100; clearInterval(interval);
                            setTimeout(() => { this.isLoading = false; if(this.messages.length === 0) this.addTypewriterMessage("Halo Master Dani! Ada yang bisa saya bantu? 🚀"); }, 500);
                        }
                    }, 100);
                },

                switchTab(id) { if(this.activeTab === id) return; this.isTabLoading = true; setTimeout(() => { this.activeTab = id; this.isTabLoading = false; }, 800); },
                toggleTheme() { this.isDark = !this.isDark; localStorage.setItem('theme', this.isDark ? 'dark' : 'light'); },
                formatRupiah(num) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num); },
                addTransaction() { if(!this.newTrx.name || !this.newTrx.amount) return; const amt = parseInt(this.newTrx.amount); this.transactions.unshift({ id: Date.now(), name: this.newTrx.name, amount: amt, type: this.newTrx.type, date: 'Today' }); this.balance += (this.newTrx.type === 'in' ? amt : -amt); localStorage.setItem('cynix_finance', JSON.stringify({ balance: this.balance, transactions: this.transactions })); this.showAddModal = false; this.newTrx = { name: '', amount: '', type: 'out' }; },
                resetFinance() { if(confirm("Reset?")) { this.balance = 0; this.transactions = []; localStorage.removeItem('cynix_finance'); } },
                clearChat() { if(confirm("Hapus chat?")) this.messages = []; },
                parseMarkdown(t) { return t.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); },
                scrollToBottom() { this.$nextTick(() => { const c = document.getElementById('chatArea'); c.scrollTop = c.scrollHeight; }); },

                addTypewriterMessage(fullText) {
                    const msgId = Date.now() + Math.random();
                    this.messages.push({ id: msgId, sender: 'ai', text: '', time: 'Now', reaction: null, isTypingEffect: true });
                    let i = 0;
                    const typeLoop = () => {
                        if (i < fullText.length) {
                            const msg = this.messages.find(m => m.id === msgId);
                            if(msg) { msg.text += fullText.charAt(i); i++; this.scrollToBottom(); setTimeout(typeLoop, 15); }
                        } else {
                            const msg = this.messages.find(m => m.id === msgId); if(msg) msg.isTypingEffect = false;
                            
                            // TRIGGER NOTIFICATION KALO TAB NGUMPET
                            if (document.visibilityState === 'hidden' && Notification.permission === 'granted') {
                                new Notification("Cynix AI", { body: fullText.substring(0, 50) + "...", icon: this.aiAvatar });
                            }
                        }
                    };
                    typeLoop();
                },

                swipeHandler(msg) {
                    return {
                        startX: 0, startY: 0, offsetX: 0, isSwiping: false, pressTimer: null, isScrolling: false,
                        startSwipe(e) { this.startX = e.touches[0].clientX; this.isSwiping = true; },
                        moveSwipe(e) { if (!this.isSwiping) return; let diff = e.touches[0].clientX - this.startX; if (diff > 0 && diff < 100) this.offsetX = diff; },
                        endSwipe() { if (this.offsetX > 50) { this.$data.replyingTo = msg; if(navigator.vibrate) navigator.vibrate(20); } this.offsetX = 0; this.isSwiping = false; },
                        startLongPress(e) { this.isScrolling = false; if(e.touches) this.startY = e.touches[0].clientY; this.pressTimer = setTimeout(() => { if(!this.isScrolling) this.triggerLongPress(); }, 500); },
                        cancelLongPress() { clearTimeout(this.pressTimer); },
                        triggerLongPress() { if(navigator.vibrate) navigator.vibrate(50); this.$data.activeContextMenu = true; this.$data.selectedMsgForContext = msg; }
                    }
                },

                reactToContext(emoji) { if(this.selectedMsgForContext) this.selectedMsgForContext.reaction = emoji; this.activeContextMenu = null; },
                replyFromContext() { this.replyingTo = this.selectedMsgForContext; this.activeContextMenu = null; this.$nextTick(() => document.querySelector('textarea').focus()); },
                copyFromContext() { navigator.clipboard.writeText(this.selectedMsgForContext.text); this.activeContextMenu = null; },

                async sendMessage() {
                    if(!this.chatInput.trim()) return;
                    const txt = this.chatInput; const ctx = this.replyingTo;
                    
                    this.messages.push({ id: Date.now(), sender: 'user', text: txt, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), reaction: null, replyTo: ctx });
                    this.chatInput = ''; this.replyingTo = null; this.scrollToBottom();

                    // SET STATUS BERFIKIR
                    this.isThinking = true;

                    const history = this.messages.slice(-6).map(m => `${m.sender}: ${m.text}`).join('\n');
                    let prompt = `History:\n${history}\n`;
                    if(ctx) { prompt += `[SYSTEM: User replying to: "${ctx.text}"]\n`; }
                    prompt += `User: ${txt}`;

                    try {
                        const res = await fetch(`http://legal.servercloud.my.id:6003/ask-ai?text=${encodeURIComponent(prompt)}&apikey=CYNIX-GANTENG-123`);
                        const data = await res.json();
                        this.isThinking = false; // SELESAI MIKIR
                        this.addTypewriterMessage(data.reply);
                    } catch(e) { 
                        this.isThinking = false;
                        this.messages.push({ id: Date.now()+1, sender: 'ai', text: "Error connection.", time: 'Now' }); 
                    }
                }
            }
        }
    </script>
</body>
</html>
